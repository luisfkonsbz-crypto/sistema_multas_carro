<DOCKTYPE html>
<html>
	
<head>
    <meta charset="UTF-8">
    <title>Lista de Infrações</title>
	<link th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}" rel="stylesheet">
</head>

<body class="container">
	
	<div class="card shadow-sm border-0 rounded-3 mb-4">
	    <div class="card-header bg-primary text-white">
	        <h5 class="card-title mb-0 fw-bold">Cadastrar Infração</h5>
	    </div>
	    <div class="card-body p-4">
	        <form th:action="@{/infracoes}" th:object="${infracao}" method="POST">
	            
	            <div class="mb-3">
	                <label for="pontos" class="form-label fw-semibold">Pontos</label>
	                <input th:field="*{pontos}" id="pontos" type="number" class="form-control" placeholder="Digite os pontos da infração" required>
	            </div>

	            <div class="mb-3">
	                <label for="valor" class="form-label fw-semibold">Valor (R$)</label>
	                <div class="input-group">
	                    <span class="input-group-text">R$</span>
	                    <input th:field="*{valor}" id="valor" type="number" step="0.01" class="form-control" placeholder="0,00" required>
	                </div>
	            </div>

	            <div class="mb-4">
	                <label for="descricao" class="form-label fw-semibold">Descrição</label>
	                <textarea th:field="*{descricao}" id="descricao" class="form-control" rows="3" placeholder="Digite a descrição da infração" required></textarea>
	            </div>

	            <div class="d-grid gap-2">
	                <button type="submit" class="btn btn-primary fw-bold py-2">
	                    Cadastrar Infração
	                </button>
	            </div>

	        </form>
	    </div>
	</div>
		
	<div class= "card-title">
        <h1>LISTA DE INFRAÇÕES CADASTRADAS - LUIS FERNANDO K. BEZERRA</h1>
	</div>
	<table class="table table-striped">
		
		<thead class="table table-striped">
			<tr>
				<th>DESCRICAO</th>
				<th>PONTOS</th>	
				<th>VALOR</th>
				<th>AÇÕES</th>
			</tr>
		</thead>
		<tbody class="table table-striped">
			<tr th:each="infractionDB : ${infracoesDB}">
                <td th:text="${infractionDB.descricao}"></td>
                <td th:text="${infractionDB.pontos}"></td>
                <td th:text="${infractionDB.valor}"></td>
                <td> 
                    <a th:href="@{/infracoes/{id}(id=${infractionDB.id})}" class="btn btn-warning">Editar</a>
                    <a th:href="@{/infracoes/deletar/{id}(id=${infractionDB.id})}" class="btn btn-danger">Excluir</a>
                </td>
			</tr>
			<tr th:each="infraction : ${infracoes}">
                <td th:text="${infraction.descricao}"></td>
                <td th:text="${infraction.pontos}"></td>
                <td th:text="${infraction.valor}"></td>
				<td> 
                    <a th:href="@{/infracoes/{id}(id=${infraction.id})}" class="btn btn-warning">Editar</a>
					<a th:href="@{/infracoes/deletar/{id}(id=${infraction.id})}" class="btn btn-danger">Excluir</a>
				</td>
			</tr>
		</tbody>
	</table>
</body>
</html>
