<DOCKTYPE html>
	<html>
		
	<head>
        <meta charset="UTF-8">
        <title>Editar Infracoes</title>
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
	</head>
	<body>
        <div class="container mt-5">
            <h1>Editar Infracoes</h1>
            <form th:action="@{/infracoes/{id}(id=${infracao.id})}" th:object="${infracao}" method="post">
                <div class="mb-3">
                    <label for="descricao" class="form-label">Descrição</label>
                    <input type="text" class="form-control" id="descricao" th:field="*{descricao}" required>
                </div>
                <div class="mb-3">
                    <label for="data" class="form-label">Data</label>
                    <input type="date" class="form-control" id="data" th:field="*{data}" required>
                </div>
                <div class="mb-3">
                    <label for="valor" class="form-label">Valor</label>
                    <input type="number" step="0.01" class="form-control" id="valor" th:field="*{valor}" required>
                </div>
                <button type="submit" class="btn btn-primary">Salvar</button>
            </form>
            <a th:href="@{/infracoes}" class="btn btn-secondary mt-3">Cancelar</a>
        </div>
	</html>
