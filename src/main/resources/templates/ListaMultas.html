<DOCKTYPE HTML>
<html>
	<head>
        <meta charset="UTF-8">
        <title>Lista de Multas</title>
		 <link th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}" rel="stylesheet">
	</head>
	
	<body>
		<div th:insert="Menu :: menu"></div>
		
		<!-- Cadastrar Multas - associando 'carro' à 'infracao' (selecionar do que já está cadastrado -->
		<div class="card shadow-sm border-0 rounded-3 mb-4">
            <div class="card-header bg-primary text-white">
				<h5 class="card-title mb-0 fw-bold">Cadastrar Multa</h5>
			</div>
			<div class="card-body p-4">
                <form th:action="@{/multas}" th:object="${multa}" method="POST">
                    
                    <div class="mb-3">
                        <label for="infracao" class="form-label fw-semibold">Infração</label>
                        <select th:field="*{infracao}" id="infracao" class="form-select" required>
                            <option th:each="infracao : ${infracoes}" th:value="${infracao.id}" th:text="${infracao.descricao}"></option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="carro" class="form-label fw-semibold">Carro</label>
                        <select th:field="*{carro}" id="carro" class="form-select" required>
                            <option th:each="carro : ${carros}" th:value="${carro.id}" th:text="${carro.placa}"></option>
                        </select>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary fw-bold py-2">
                            Cadastrar Multa
                        </button>
                    </div>

                </form>
			</div>
		</div>															
			
			
        <h1>Lista de Multas</h1>
        <table border="1">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Descrição</th>
                    <th>Valor</th>
                    <th>Placa</th>
					<th>Cidade</th>
					<th>Ano</th>
                </tr>
            </thead>
            <tbody>
                <!-- Aqui você pode adicionar as linhas da tabela com os dados das multas - incluindo relacoes com Carro e Infracao -->
				<tr th:each="multa : ${multas}">
                    <td th:text="${multa.id}"></td>
                    <td th:text="${multa.infracao.descricao}"></td>
                    <td th:text="${multa.infracao.valor}"></td>
                    <td th:text="${multa.carro.placa}"></td>
					<td th:text="${multa.cidade}"></td>
					<td th:text="${multa.ano}"></td>
                </tr>
				
            </tbody>
        </table>
    </body>		
</html>
